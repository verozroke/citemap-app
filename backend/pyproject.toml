[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "citemap-api"
version = "0.1.0"
description = "REST API of CiteMap: citation network search, graph building, clustering and export."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Takayev Askhat" }]
dependencies = [
  # Analysis core published in Assignment 3; pinned to its release tag.
  "citemap-core @ git+https://github.com/verozroke/citemap-core.git@v0.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
citemap-api = "citemap_api.main:run"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/citemap_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette 1.x prefers the httpx2 client in TestClient; httpx still works.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["citemap_api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "networkx", "networkx.*"]
ignore_missing_imports = true
